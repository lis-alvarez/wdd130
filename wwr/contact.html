<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | WildWave Rafting </title>
    <meta name="description"
      content="Get in touch with Wildwave rafting for reservations, trip information, and answers to your rafting adventure questions.">
    <meta name="author" content="Lisbeth Alvarez Mora">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-wwr-crossedoars.png" alt="WildWave Rafting company Logo">
        <nav>
            <ul class="nav">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="info">
            <h1>WildWave Rafting Company</h1>
            <address>
                <p>Vía Calceta - La Esperanza Km3</p>
                <p>Calceta, Manabí</p>
                <p>+593 99 876 5432</p>
            </address>

        </section>

        <section class="contact-layout">
            <div class="map"><iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d127658.42054547087!2d-80.11395375000004!3d-0.9004243999999962!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x902b752f52a7a323%3A0xb61f09bf9ae25b82!2sPresa%20La%20Esperanza!5e0!3m2!1ses!2sec!4v1780691862717!5m2!1ses!2sec"
                  allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email"
                      required>
                </div>

                <div class="purpose-group">
                    <label for="purpose">Message Purpose</label>

                    <div class="radio-list">
                        <div>
                            <input type="radio" name="purpose" id="inquiry">
                            <label for="inquiry">General Inquiry</label>
                        </div>

                        <div>
                            <input type="radio" name="purpose" id="reservation">
                            <label for="reservation">Reservation Question</label>
                        </div>
                        <div>
                            <input type="radio" name="purpose" id="suggestion">
                            <label for="suggestion">Website Suggestion</label>
                        </div>
                    </div>


                </div>

                <div class="form-group message">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" placeholder="Type here"
                      required></textarea>
                </div>

                <div class="checkbox">
                    <label for="subscription">Please Subscribe me to the monthly newsletter</label>
                    <input type="checkbox" id="subscription" name="subscription">
                </div>

                <button type="submit">
                    Get in Touch!
                </button>
            </form>


        </section>


        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <figure>
                <img src="images/employee1.webp" alt="John Velez">
                <figcaption>John Velez - Lead River Guide</figcaption>
            </figure>
            <figure>
                <img src="images/employee2.webp" alt="Sarah Mera">
                <figcaption>Sarah Mera - Safety Coordinator</figcaption>
            </figure>
            <figure>
                <img src="images/employee3.webp" alt="Michael Davis">
                <figcaption>Michael Davis - Operations Manager</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>©2026 | 🚣‍♂️WildWave Rafting🚣‍♂️ | Lisbeth Alvarez</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
            <a href="https://whatsapp.com">
                <img src="images/whatsapp.svg" alt="Whatsapp Icon">
            </a>
        </nav>


    </footer>
</body>

</html>

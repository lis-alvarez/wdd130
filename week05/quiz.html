<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Forms</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main class="box">
        <h1>✅Basic HTML and CSS Quiz</h1>
        <form>
            <div class="quiz-item box">
                <label for="q1">1. What does the acronym CSS satnd for?</label>
                <input type="text" id="q1" name="q1">
            </div>
        </form>

        <form>
            <div class="quiz-item box">
                <label for="q2">2. How are id and class atrtibutes selected in CSS?</label>
                <textarea name="q2" id="q2"></textarea>
            </div>
        </form>

        <form>
            <div class="quiz-item box">
                <label for="q3">3. Wich of the following is a valid CSS comment?</label>
                <select name="q3" id="q3">
                    <option value="" selected disabled>Chose one</option>
                    <option value="1">&lt;A. !--This is a comment--&lt;</option>
                    <option value="2">B. /*This is a comment*/</option>
                    <option value="3">C. //This is a comment//</option>
                </select>
            </div>
        </form>

        <form>
            <div class="quiz-item box">
                <label for="q4">1. What is the bottom margin given this declaration?</label>
                <code class="box">margin: 10px 5px 15px;</code>
                <input type="number" id="q1" name="q1">
            </div>

            <button type="button">Submit Quiz</button>
        </form>


    </main>
</body>

</html>
